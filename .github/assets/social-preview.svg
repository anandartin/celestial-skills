<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <radialGradient id="bg" cx=".25" cy=".2" r="1.1"><stop offset="0" stop-color="#1c2036"/><stop offset=".55" stop-color="#0d0f1a"/><stop offset="1" stop-color="#07080d"/></radialGradient>
    <linearGradient id="d" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070f"/><stop offset=".6" stop-color="#1b3a9a"/><stop offset="1" stop-color="#7aa7ff"/></linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5b8cff"/><stop offset="1" stop-color="#c06cff"/></linearGradient>
    <filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity=".45"/></filter>
  </defs>
  <rect width="1280" height="640" fill="url(#bg)"/>
  <g fill="#fff">
    <circle cx="96" cy="70" r="1.2" opacity=".5"/><circle cx="410" cy="44" r="1" opacity=".4"/><circle cx="640" cy="110" r="1.4" opacity=".35"/><circle cx="1180" cy="60" r="1.2" opacity=".5"/><circle cx="1230" cy="300" r="1" opacity=".4"/><circle cx="560" cy="580" r="1.2" opacity=".35"/><circle cx="60" cy="560" r="1" opacity=".4"/><circle cx="760" cy="40" r="1" opacity=".5"/><circle cx="1010" cy="610" r="1.3" opacity=".35"/><circle cx="300" cy="610" r="1" opacity=".3"/>
  </g>
  <!-- brand -->
  <circle cx="98" cy="110" r="22" fill="#f4f3f8"/>
  <text x="134" y="121" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="30" font-weight="600" fill="#f4f3f8" letter-spacing="-.5">Celestial skills</text>
  <!-- headline -->
  <text font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-weight="700" fill="#f4f3f8" letter-spacing="-2.4">
    <tspan x="76" y="248" font-size="66">120+ open skills</tspan>
    <tspan x="76" y="322" font-size="66">for AI agents.</tspan>
  </text>
  <rect x="78" y="350" width="120" height="4" rx="2" fill="url(#glow)"/>
  <text font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="25" fill="#b9bccd">
    <tspan x="76" y="404">Design, experience and engineering skills</tspan>
    <tspan x="76" y="440">on one shared core — drop a folder in, and</tspan>
    <tspan x="76" y="476">your agent builds the way you would.</tspan>
  </text>
  <text x="76" y="574" font-family="'SF Mono', Menlo, monospace" font-size="20" fill="#8e92a8">github.com/anandartin/celestial-skills · Apache-2.0</text>
  <!-- three skill cards, staggered so every title shows -->
  <g filter="url(#sh)">
    <g transform="translate(748 46) rotate(-3)">
      <rect width="420" height="168" rx="20" fill="url(#d)"/>
      <text x="24" y="38" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#dfe4ff" letter-spacing="1">Design skill</text>
      <text x="24" y="142" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="38" font-weight="700" fill="#f4f3f8" letter-spacing="-1.4">Mercury</text>
    </g>
    <g transform="translate(800 236) rotate(1.5)">
      <rect width="420" height="168" rx="20" fill="#f5ede0"/>
      <text x="24" y="38" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#b36a2a" font-weight="600" letter-spacing="1">Customer journey</text>
      <text font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" fill="#2a1d10" letter-spacing="-.8"><tspan x="24" y="112">Paying someone new</tspan><tspan x="24" y="144">from a banking app</tspan></text>
    </g>
    <g transform="translate(756 426) rotate(-1.5)">
      <rect width="420" height="168" rx="20" fill="#e8f0f9"/>
      <text x="24" y="38" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" fill="#1662c4" font-weight="600" letter-spacing="1">Engineering practice</text>
      <text x="24" y="142" font-family="-apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="29" font-weight="700" fill="#0e1d30" letter-spacing="-.9">Spec-driven development</text>
    </g>
  </g>
</svg>
