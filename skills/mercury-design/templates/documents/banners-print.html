<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Mercury banners</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope&family=DM+Mono&display=swap">
<style>
  :root { --bg:#fbfbfc; --surface:#ffffff; --band:#f1f2f5; --ink:#14161b; --ink-2:#33373f; --muted:#5c6270; --line:#dcdfe6; --accent:#2547d0; --on-accent:#ffffff; --accent-text:#2547d0; --button:#2547d0; --on-button:#ffffff;
          --font-display:'Manrope', system-ui, sans-serif; --font-body:'Manrope', system-ui, sans-serif; --font-mono:'DM Mono', ui-monospace, monospace; --hw:700; --track:-.02em; --radius:8px; --radius-card:16px; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--font-display);font-weight:var(--hw);letter-spacing:var(--track);line-height:1.1;margin:0}
  p{margin:0 0 1em;color:var(--ink-2)} .eyebrow{font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:var(--radius);background:var(--button);color:var(--on-button);font:500 14px/1 var(--font-body);text-decoration:none}
  table{border-collapse:collapse;width:100%;font-size:14px} th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)} th{font:500 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  blockquote{margin:0;font-family:var(--font-display);font-weight:var(--hw);font-size:1.6em;line-height:1.2;letter-spacing:var(--track)}
  figure{margin:0} figcaption{font:400 12px/1.4 var(--font-mono);color:var(--muted);margin-top:8px}
  .fig{background:var(--band);border-radius:var(--radius-card);aspect-ratio:16/9}
  .stat b{display:block;font:var(--hw) 56px/1 var(--font-display);color:var(--accent-text);letter-spacing:var(--track)}
</style>
<style>
  body{background:var(--line);padding:24px;display:grid;gap:24px;justify-items:start}
  .ad{background:var(--band);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:6%;font-size:min(4vw,32px)}
  .ad b.logo{font-family:var(--font-display);font-size:1em} .ad h2{font-size:1.4em;line-height:1.05;max-width:12ch;text-wrap:balance} .ad h2 b{color:var(--accent-text);font-weight:inherit}
  .ad .btn{height:auto;padding:.5em .9em;font-size:.6em} .ad .stripe{position:absolute;left:0;top:0;bottom:0;width:.5em;background:var(--accent)}
  .ad.wide{flex-direction:row;align-items:center;gap:2%;padding:2% 3%} .ad.wide h2{font-size:1em;flex:1;max-width:none}
  .ad.tall{padding:8% 10%} .ad.tall h2{font-size:2.6em} .ad.tall .btn{font-size:1em;padding:.7em 1.2em}
  figcaption{font:400 12px var(--font-mono);color:var(--muted);margin-top:8px}
</style></head><body>
<figure><div class="ad  tall" style="width:850px;height:2000px;zoom:0.28;"><div class="stripe"></div><span class="logo"><span class="d-logo" style="display:inline-flex;align-items:center;gap:8px;font:600 16px/1 var(--font-display);letter-spacing:-.01em;color:inherit;vertical-align:middle"><svg class="d-mark"  viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22" style="display:block;flex:none"><circle cx="12" cy="12" r="12" fill="#2547d0"/></svg><span>Mercury</span></span></span><h2>Agents you can watch and <b>approve</b></h2><a class="btn" href="#">Build an agent</a></div><figcaption>Roll-up 850×2000 mm</figcaption></figure>
</body></html>
