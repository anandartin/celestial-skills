<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Agents you can watch and approve. — Mercury poster</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope&family=DM+Mono&display=swap">
<style>
  :root { --bg:#fbfbfc; --surface:#ffffff; --band:#f1f2f5; --ink:#14161b; --ink-2:#33373f; --muted:#5c6270; --line:#dcdfe6; --accent:#2547d0; --on-accent:#ffffff; --accent-text:#2547d0; --button:#2547d0; --on-button:#ffffff;
          --font-display:'Manrope', system-ui, sans-serif; --font-body:'Manrope', system-ui, sans-serif; --font-mono:'DM Mono', ui-monospace, monospace; --hw:700; --track:-.02em; --radius:8px; --radius-card:16px; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--font-display);font-weight:var(--hw);letter-spacing:var(--track);line-height:1.1;margin:0}
  p{margin:0 0 1em;color:var(--ink-2)} .eyebrow{font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:var(--radius);background:var(--button);color:var(--on-button);font:500 14px/1 var(--font-body);text-decoration:none}
  table{border-collapse:collapse;width:100%;font-size:14px} th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)} th{font:500 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  blockquote{margin:0;font-family:var(--font-display);font-weight:var(--hw);font-size:1.6em;line-height:1.2;letter-spacing:var(--track)}
  figure{margin:0} figcaption{font:400 12px/1.4 var(--font-mono);color:var(--muted);margin-top:8px}
  .fig{background:var(--band);border-radius:var(--radius-card);aspect-ratio:16/9}
  .stat b{display:block;font:var(--hw) 56px/1 var(--font-display);color:var(--accent-text);letter-spacing:var(--track)}
</style>
<style>
  .poster{width:1080px;height:1350px}
  body{background:var(--line);padding:16px} .poster{margin:0 auto;background:var(--band);position:relative;overflow:hidden;padding:72px;display:flex;flex-direction:column}
  @media print{body{padding:0;background:none}.poster{margin:0}}
  .poster .eyebrow{font-size:18px} .poster h1{font-size:132px;line-height:.95;margin:auto 0 40px;max-width:11ch;text-wrap:balance}
  .poster h1 b{color:var(--accent-text);font-weight:inherit} .poster p{font-size:30px;max-width:34ch;color:var(--ink-2)}
  .poster .band{position:absolute;right:0;top:0;bottom:0;width:28px;background:var(--accent)}
  .poster .foot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:40px} .poster .foot b{font-family:var(--font-display);font-size:44px} .poster .foot .eyebrow{text-align:right;line-height:1.6}
</style></head><body>
<section class="poster"><div class="band"></div><div><span class="d-logo" style="display:inline-flex;align-items:center;gap:16px;font:600 32px/1 var(--font-display);letter-spacing:-.01em;color:inherit;vertical-align:middle"><svg class="d-mark"  viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="44" height="44" style="display:block;flex:none"><circle cx="12" cy="12" r="12" fill="#2547d0"/></svg><span>Mercury</span></span></div><span class="eyebrow">September 2026</span><h1>Agents you can watch and <b>approve</b></h1><p>Set up an agent, see every step it takes, and approve anything that matters before it happens.</p><div class="foot"><span class="d-logo" style="display:inline-flex;align-items:center;gap:14px;font:600 29px/1 var(--font-display);letter-spacing:-.01em;color:inherit;vertical-align:middle"><svg class="d-mark"  viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="40" height="40" style="display:block;flex:none"><circle cx="12" cy="12" r="12" fill="#2547d0"/></svg><span>Mercury</span></span><span class="eyebrow">@mercury<br>Build an agent</span></div></section>
</body></html>
