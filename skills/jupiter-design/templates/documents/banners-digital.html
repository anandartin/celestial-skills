<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Jupiter Admin Kit banners</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans&family=JetBrains+Mono&display=swap">
<style>
  :root { --bg:#ffffff; --surface:#ffffff; --band:#f3f6f8; --ink:#1c2830; --ink-2:#34434d; --muted:#586873; --line:#dbe3e9; --accent:#507992; --on-accent:#ffffff; --accent-text:#486d83; --button:#507992; --on-button:#ffffff;
          --font-display:'Public Sans', system-ui, sans-serif; --font-body:'Public Sans', system-ui, sans-serif; --font-mono:'JetBrains Mono', ui-monospace, monospace; --hw:600; --track:-.02em; --radius:6px; --radius-card:12px; }
  *{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 var(--font-body);-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:var(--font-display);font-weight:var(--hw);letter-spacing:var(--track);line-height:1.1;margin:0}
  p{margin:0 0 1em;color:var(--ink-2)} .eyebrow{font:500 11px/1 var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .btn{display:inline-flex;align-items:center;height:44px;padding:0 18px;border-radius:var(--radius);background:var(--button);color:var(--on-button);font:500 14px/1 var(--font-body);text-decoration:none}
  table{border-collapse:collapse;width:100%;font-size:14px} th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line)} th{font:500 11px/1 var(--font-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
  blockquote{margin:0;font-family:var(--font-display);font-weight:var(--hw);font-size:1.6em;line-height:1.2;letter-spacing:var(--track)}
  figure{margin:0} figcaption{font:400 12px/1.4 var(--font-mono);color:var(--muted);margin-top:8px}
  .fig{background:var(--band);border-radius:var(--radius-card);aspect-ratio:16/9}
  .stat b{display:block;font:var(--hw) 56px/1 var(--font-display);color:var(--accent-text);letter-spacing:var(--track)}
</style>
<style>
  body{background:var(--line);padding:24px;display:grid;gap:24px;justify-items:start}
  .ad{background:var(--band);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:space-between;padding:6%;font-size:min(4vw,32px)}
  .ad b.logo{font-family:var(--font-display);font-size:1em} .ad h2{font-size:1.4em;line-height:1.05;max-width:12ch;text-wrap:balance} .ad h2 b{color:var(--accent-text);font-weight:inherit}
  .ad .btn{height:auto;padding:.5em .9em;font-size:.6em} .ad .stripe{position:absolute;left:0;top:0;bottom:0;width:.5em;background:var(--accent)}
  .ad.wide{flex-direction:row;align-items:center;gap:2%;padding:2% 3%} .ad.wide h2{font-size:1em;flex:1;max-width:none}
  .ad.tall{padding:8% 10%} .ad.tall h2{font-size:2.6em} .ad.tall .btn{font-size:1em;padding:.7em 1.2em}
  figcaption{font:400 12px var(--font-mono);color:var(--muted);margin-top:8px}
</style></head><body>
<figure><div class="ad wide " style="width:728px;height:90px;"><div class="stripe"></div><span class="logo"><span class="d-logo" style="display:inline-flex;align-items:center;gap:8px;font:600 16px/1 var(--font-display);letter-spacing:-.01em;color:inherit;vertical-align:middle"><svg class="d-mark"  viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22" style="display:block;flex:none"><circle cx="12" cy="12" r="12" fill="#507992"/></svg><span>Jupiter Admin Kit</span></span></span><h2>Every admin screen, one calm <b>kit</b></h2><a class="btn" href="#">Open the kit</a></div><figcaption>Leaderboard 728×90</figcaption></figure><figure><div class="ad  " style="width:300px;height:250px;font-size:14px"><div class="stripe"></div><span class="logo"><span class="d-logo" style="display:inline-flex;align-items:center;gap:6px;font:600 13px/1 var(--font-display);letter-spacing:-.01em;color:inherit;vertical-align:middle"><svg class="d-mark"  viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="18" height="18" style="display:block;flex:none"><circle cx="12" cy="12" r="12" fill="#507992"/></svg><span>Jupiter Admin Kit</span></span></span><h2>Every admin screen, one calm <b>kit</b></h2><a class="btn" href="#">Open the kit</a></div><figcaption>Medium rectangle 300×250</figcaption></figure><figure><div class="ad  " style="width:1080px;height:1080px;zoom:0.35;"><div class="stripe"></div><span class="logo"><span class="d-logo" style="display:inline-flex;align-items:center;gap:8px;font:600 16px/1 var(--font-display);letter-spacing:-.01em;color:inherit;vertical-align:middle"><svg class="d-mark"  viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22" style="display:block;flex:none"><circle cx="12" cy="12" r="12" fill="#507992"/></svg><span>Jupiter Admin Kit</span></span></span><h2>Every admin screen, one calm <b>kit</b></h2><a class="btn" href="#">Open the kit</a></div><figcaption>Square 1080×1080</figcaption></figure><figure><div class="ad  " style="width:1200px;height:628px;zoom:0.45;"><div class="stripe"></div><span class="logo"><span class="d-logo" style="display:inline-flex;align-items:center;gap:8px;font:600 16px/1 var(--font-display);letter-spacing:-.01em;color:inherit;vertical-align:middle"><svg class="d-mark"  viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" width="22" height="22" style="display:block;flex:none"><circle cx="12" cy="12" r="12" fill="#507992"/></svg><span>Jupiter Admin Kit</span></span></span><h2>Every admin screen, one calm <b>kit</b></h2><a class="btn" href="#">Open the kit</a></div><figcaption>Landscape 1200×628</figcaption></figure>
</body></html>
